# THE place you set models & parameters. Code reads only from here.
seed: 42
device: cpu
ingest:
  data_root: "data"
  raw_dir: "raw"
  pages_dir: "interim/pages"
  blank_dir: "interim/blank"
  layout_dir: "interim/layout"
  ocr_dir: "interim/ocr"
  chunk_dir: "interim/chunks"
  blank_stats_max_dim: 1600
  render_dpi: 150
  min_blob_area: 15
  ink_ratio_threshold: 0.002
  min_blob_count: 3

enhance:   {enabled: false,  model: "unet_small", type: "diffusion"}   # or "vae" / "none"
layout:    {model: "yolov10n", score_thr: 0.082}   # down from 0.25
ocr:
  tesseract_lang: "ben"
  use_corrector: true
  corrector_checkpoint_path: "mt5-small-2200"   
  corrector_max_length: 96
  corrector_batch_size: 32
  corrector_cpu_threads: null   
  gt_dir: "ground-truth-ocr"
  held_out_docs: ["Krishi-Darpan"]
embed:     {model: "BAAI/bge-m3", dim: 512}
index:     {type: "faiss:hnsw", chunk_tokens: 256, overlap: 32}
retrieve:  {k: 10, k_step: 10, k_max: 40, weak_threshold: 0.35, rerank: true, reranker: "cross-encoder/ms-marco-MiniLM-L6-v2"}   # k_step/k_max/weak_threshold drive evidence-gated re-search
agent:     {max_steps: 8, autonomy: "act-with-approval", budget_usd: 0.05}
rl:        {algo: "ppo", train_policy: false}                         # bonus: set true
serve:     {batch: true}
deploy:    {target: "hf-spaces"}
