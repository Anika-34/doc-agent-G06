[project]
name = "doc-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2,<2.4",
  "transformers>=4.40,<4.45",
  "lightning>=2.2,<2.4",
  "timm>=1.0,<1.1",
  "datasets>=2.19,<3.0",
  "torchmetrics>=1.3,<1.5",
  "sentence-transformers>=2.7,<3.0",
  "faiss-cpu>=1.8,<1.9",
  "gymnasium>=0.29,<1.0",
  "fastapi>=0.111,<0.116",
  "gradio>=4.31,<5.0",
  "wandb>=0.17,<0.18",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "pydantic-settings>=2.2,<3.0",
  "opencv-python>=4.10,<5.0",
  "pdf2image>=1.17,<2.0",
  "pandas>=2.2,<2.3",
  "numpy>=1.26,<2.0",
  "matplotlib>=3.8,<3.10",
  "tqdm>=4.66,<5.0",
  "pypdf>=4.2,<5.0",
  "pillow>=10.3,<11.0",
  "pytesseract>=0.3.10,<0.4",
  "jiwer>=3.0,<4.0",
  "kaggle>=1.6,<2.0",
  "doclayout-yolo>=0.0.4",
  "huggingface-hub>=0.36.2",
  "sentencepiece>=0.2,<0.3",
  "protobuf>=4.25,<5.0",
  "kagglehub>=0.1.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "black>=24.4", "mypy>=1.10", "pytest>=8.2", "pre-commit>=3.7"]
notebook = ["ipykernel>=6.29,<7.0", "jupyterlab>=4.2,<5.0"]
ocr = [
  "easyocr>=1.7,<1.8",
  "paddleocr>=2.7,<3.0",
]
